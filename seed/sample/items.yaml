# Generic placeholder items. Each demonstrates a different
# quantity formula and condition shape.

items:
  - id: item_always_one
    display_name: Always-one Item
    category: cat_general
    default_bag: main_bag
    include_when: true
    quantity:
      fixed: 1

  - id: item_per_day
    display_name: Per-day Item
    category: cat_clothing
    default_bag: main_bag
    include_when: true
    quantity:
      per_day: 1

  - id: item_every_two_days
    display_name: Every-two-days Item
    category: cat_clothing
    default_bag: main_bag
    include_when: true
    quantity:
      per_n_days:
        n: 2
        min: 1

  - id: item_per_shabbat
    display_name: Per-shabbat Item
    category: cat_general
    default_bag: main_bag
    include_when:
      includes_shabbat: true
    quantity:
      per_shabbat: 1

  - id: item_when_env_a
    display_name: Item for Environment A
    category: cat_clothing
    default_bag: main_bag
    include_when: env_a
    quantity:
      fixed: 1

  - id: item_when_accom_a_and_plan_a
    display_name: Item when Accommodation A and Plan A
    category: cat_general
    default_bag: small_bag
    include_when:
      all_params:
        - accom_a
        - plan_a
    quantity:
      days_plus:
        add: 1
        min: 2

  - id: item_optional_warm
    display_name: Optional warm-weather Item
    category: cat_clothing
    default_bag: main_bag
    is_optional: true
    include_when: env_b
    quantity:
      fixed: 1

  - id: item_kit_first_aid
    display_name: Sample Kit
    category: cat_kit
    default_bag: main_bag
    is_kit: true
    kit_contents:
      - id: kit_comp_a
        display_name: Component A
        default_count: 1
      - id: kit_comp_b
        display_name: Component B
        default_count: 2
    include_when: true
    quantity:
      fixed: 1
