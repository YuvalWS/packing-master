# Production stack: the app (runtime image) + MySQL 8. Used by proxmox/install.sh inside
# the LXC; also runs anywhere with Docker:
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# Settings come from the env file (see deploy/env.example). Data lives under DATA_DIR.
name: packing-master

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?set DB_ROOT_PASS}
      MYSQL_DATABASE: packing
      MYSQL_USER: packing
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ${DATA_DIR:-/var/lib/packing-master}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      target: runtime
    image: packing-master:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: packing
      DB_PASS: ${DB_PASS}
      DB_NAME: packing
      BACKUP_DIR: /backups
      CONTROL_DIR: /control
      # Backup uploads can exceed adapter-node's 512K default.
      BODY_SIZE_LIMIT: 50M
      # Behind a Cloudflare tunnel the original scheme arrives in this header.
      PROTOCOL_HEADER: x-forwarded-proto
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ${DATA_DIR:-/var/lib/packing-master}/backups:/backups
      - ${DATA_DIR:-/var/lib/packing-master}/control:/control
    ports:
      - "${HTTP_PORT:-80}:3000"
