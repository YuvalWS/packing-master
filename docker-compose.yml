services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      db_dev:
        condition: service_healthy
      db_test:
        condition: service_healthy

  db_dev:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT_HOST:-3316}:3306"
    volumes:
      - db_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db_test:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_TEST_PASS}
      MYSQL_DATABASE: ${DB_TEST_NAME}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_TEST_PORT_HOST:-3317}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_TEST_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_dev_data: {}
